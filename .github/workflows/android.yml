name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK
        run: ./gradlew assembleDebug
      # The debug APK is attached to this run as a downloadable artifact.
      # Signed release builds stay in the manual Signed APK workflow, which
      # publishes a GitHub Release asset instead.
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Couchy-Apps-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
